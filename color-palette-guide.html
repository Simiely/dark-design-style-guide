<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配色使用表 — 情绪风格 × 用途场景 · 深浅双版主页示意</title>
<style>
:root {
  --bg: #0D1117;
  --bg-card: #161B22;
  --bg-hover: #1C2128;
  --border: #30363D;
  --text: #E6EDF3;
  --text-muted: #8B949E;
  --text-dim: #6E7681;
  --accent: #58A6FF;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  font-size: 14px;
}
.container { max-width: 1280px; margin: 0 auto; padding: 40px 24px; }
header { text-align: center; margin-bottom: 40px; }
header h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
header p { color: var(--text-muted); font-size: 15px; }
.classification-info {
  display: flex; justify-content: center; gap: 12px; margin-top: 16px; flex-wrap: wrap;
}
.classification-info span {
  padding: 4px 14px; border-radius: 20px; font-size: 13px;
  background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted);
}
.classification-info b { color: var(--accent); }

/* Tab navigation */
.tabs {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 32px;
  border-bottom: 1px solid var(--border); padding-bottom: 0;
}
.tab {
  padding: 10px 16px; cursor: pointer; border-radius: 8px 8px 0 0;
  font-size: 14px; font-weight: 500; color: var(--text-muted);
  border: 1px solid transparent; border-bottom: none;
  transition: all 0.2s; white-space: nowrap; user-select: none;
}
.tab:hover { color: var(--text); background: var(--bg-hover); }
.tab.active {
  color: var(--text); background: var(--bg-card);
  border-color: var(--border); border-bottom-color: var(--bg-card);
  margin-bottom: -1px;
}
.tab .dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 6px; vertical-align: middle;
}

/* Tab content */
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Mood header */
.mood-header {
  display: flex; align-items: center; gap: 16px; margin-bottom: 28px;
  padding: 20px 24px; border-radius: 12px; background: var(--bg-card);
  border: 1px solid var(--border);
}
.mood-number {
  font-size: 36px; font-weight: 700; color: var(--text-dim); min-width: 48px;
}
.mood-info h2 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.mood-info p { color: var(--text-muted); font-size: 13px; }

/* Use case section */
.usecase-section { margin-bottom: 36px; }
.usecase-title {
  font-size: 15px; font-weight: 600; margin-bottom: 16px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.usecase-title .icon {
  width: 20px; height: 20px; border-radius: 4px; background: var(--accent);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--bg);
}

/* Palette grid */
.palette-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(580px, 1fr)); gap: 20px;
}
.palette-grid.cols-1 { grid-template-columns: 1fr; }
.palette-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.palette-grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.palette-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden; transition: border-color 0.2s;
}
.palette-card:hover { border-color: var(--text-dim); }
.palette-header {
  padding: 14px 18px; display: flex; justify-content: space-between; align-items: center;
}
.palette-name { font-size: 14px; font-weight: 600; }
.palette-tags { display: flex; gap: 6px; }
.palette-tag {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  background: var(--bg); color: var(--text-muted); border: 1px solid var(--border);
}

/* Color swatches */
.swatches { display: flex; height: 56px; }
.swatch {
  flex: 1; display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 4px; cursor: pointer; transition: flex 0.3s; position: relative;
}
.swatch:hover { flex: 2; }
.swatch-hex {
  font-size: 10px; font-family: "SF Mono", "Fira Code", monospace;
  opacity: 0; transition: opacity 0.2s; padding: 2px 6px; border-radius: 4px;
  white-space: nowrap;
}
.swatch:hover .swatch-hex { opacity: 1; }

/* Palette details */
.palette-body { padding: 14px 18px; }
.palette-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.5; }
.palette-hex-list { display: flex; flex-wrap: wrap; gap: 6px; }
.hex-chip {
  font-size: 11px; font-family: "SF Mono", "Fira Code", monospace;
  padding: 3px 8px; border-radius: 6px; cursor: pointer;
  background: var(--bg); border: 1px solid var(--border); color: var(--text-muted);
  transition: all 0.15s;
}
.hex-chip:hover { color: var(--text); border-color: var(--text-dim); }
.hex-chip .dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 2px;
  margin-right: 5px; vertical-align: middle;
}

/* Proportion bar */
.proportion-bar {
  display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 10px;
}

/* ============ Mockup area (主页示意 · 大尺寸直出) ============ */
.mock-area {
  border-top: 1px solid var(--border);
  background: var(--bg);
  padding: 14px 18px 18px;
}
.mock-area-title {
  font-size: 11px; color: var(--text-dim); margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px;
}
.mock-area-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.mock-wrap { display: flex; flex-direction: column; gap: 16px; }
.mock-col { width: 100%; }
.mock-label {
  font-size: 12px; color: var(--text-muted); margin-bottom: 7px;
  display: flex; align-items: center; gap: 7px; font-weight: 500;
}
.mock-label .mock-dot {
  width: 12px; height: 12px; border-radius: 3px;
  border: 1px solid var(--border);
}
.mock {
  border-radius: 12px; overflow: hidden;
  border: 1px solid var(--border);
  background: var(--mbg);
  font-size: 13px; line-height: 1.4;
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
}
/* browser chrome */
.mock-chrome {
  height: 26px; background: var(--msurf);
  display: flex; align-items: center; gap: 5px; padding: 0 12px;
  border-bottom: 1px solid rgba(128,128,128,0.15);
}
.mock-chrome i { width: 8px; height: 8px; border-radius: 50%; background: var(--mmuted); opacity: 0.45; }
.mock-chrome i:first-child { opacity: 0.7; }
.mock-url {
  margin-left: 10px; font-size: 10px; color: var(--mmuted);
  background: var(--mbg); padding: 2px 14px; border-radius: 6px;
}
/* nav */
.mock-nav {
  display: flex; align-items: center; padding: 12px 18px; background: var(--mbg);
}
.mock-logo { width: 14px; height: 14px; border-radius: 4px; background: var(--mac); }
.mock-nav-items { display: flex; gap: 12px; margin-left: 18px; flex: 1; align-items: center; }
.mock-nav-items span {
  width: 38px; height: 6px; border-radius: 3px; background: var(--mmuted); opacity: 0.55;
}
.nav-btn {
  padding: 5px 14px; border-radius: 6px; background: var(--mac);
  color: var(--mat); font-size: 11px; font-weight: 600;
}
/* hero */
.mock-hero { padding: 22px 20px 18px; background: var(--mbg); }
.mock-badge {
  display: inline-block; font-size: 10px; font-weight: 600; color: var(--mac);
  border: 1px solid var(--mac); border-radius: 8px; padding: 2px 10px; opacity: 0.9;
}
.mock-title {
  font-size: 21px; font-weight: 700; color: var(--mtext);
  line-height: 1.3; margin: 10px 0 6px; letter-spacing: 0.5px;
}
.mock-sub { font-size: 12px; color: var(--mmuted); line-height: 1.5; }
.mock-btns { display: flex; gap: 8px; margin-top: 14px; }
.btn-p {
  padding: 6px 16px; border-radius: 6px; background: var(--mac);
  color: var(--mat); font-size: 11px; font-weight: 600;
}
.btn-g {
  padding: 6px 16px; border-radius: 6px; border: 1px solid var(--mmuted);
  color: var(--mtext); font-size: 11px; opacity: 0.9;
}
/* cards */
.mock-cards { display: flex; gap: 10px; padding: 0 20px 20px; background: var(--mbg); }
.mock-card {
  flex: 1; background: var(--msurf); border-radius: 8px; padding: 12px;
  border: 1px solid rgba(128,128,128,0.12);
}
.mc-icon { display: block; width: 16px; height: 16px; border-radius: 4px; background: var(--mac); margin-bottom: 8px; }
.mock-card.c2 .mc-icon { background: var(--mac2); }
.mock-card.c3 .mc-icon { background: var(--mmuted); }
.mc-t { height: 6px; width: 72%; background: var(--mtext); border-radius: 3px; opacity: 0.85; margin-bottom: 5px; }
.mc-d { height: 4px; width: 90%; background: var(--mmuted); border-radius: 2px; opacity: 0.55; margin-bottom: 4px; }
.mc-d:last-child { width: 60%; margin-bottom: 0; }
/* footer strip */
.mock-foot {
  height: 24px; background: var(--msurf);
  display: flex; align-items: center; gap: 10px; padding: 0 16px;
  border-top: 1px solid rgba(128,128,128,0.12);
}
.mock-foot .fl { width: 30px; height: 4px; border-radius: 2px; background: var(--mmuted); opacity: 0.5; }
.mock-foot .fc { font-size: 9px; color: var(--mmuted); opacity: 0.8; }

/* Footer */
footer {
  text-align: center; padding: 40px 0 20px; color: var(--text-dim); font-size: 12px;
}

/* Toast */
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  padding: 10px 24px; border-radius: 8px; font-size: 13px;
  background: var(--accent); color: var(--bg); font-weight: 500;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000;
}
.toast.show { opacity: 1; }

/* Column switcher */
.col-switch {
  display: inline-flex; align-items: center; gap: 4px;
  border: 1px solid var(--border); border-radius: 8px; padding: 3px;
  background: var(--bg-card);
}
.col-switch .cs-label {
  font-size: 12px; color: var(--text-muted); padding: 0 8px 0 6px; user-select: none;
}
.col-switch button {
  width: 30px; height: 26px; border: none; border-radius: 5px; cursor: pointer;
  background: transparent; color: var(--text-muted); font-size: 12px; font-weight: 600;
  transition: all 0.15s;
}
.col-switch button:hover { color: var(--text); background: var(--bg-hover); }
.col-switch button.active {
  background: var(--accent); color: var(--bg);
}
.tabs-row {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  margin-bottom: 32px; flex-wrap: wrap;
}
.tabs-row .tabs { margin-bottom: 0; }

/* Tag filter */
.tag-filter {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  margin-bottom: 24px; padding: 12px 14px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
}
.tf-label { font-size: 12px; color: var(--text-muted); margin-right: 2px; user-select: none; }
.tf-chip {
  border: 1px solid var(--border); background: var(--bg); color: var(--text-muted);
  font-size: 12px; padding: 3px 10px; border-radius: 12px; cursor: pointer;
  transition: all 0.15s; white-space: nowrap;
}
.tf-chip i { font-style: normal; opacity: 0.55; font-size: 11px; margin-left: 2px; }
.tf-chip:hover { color: var(--text); border-color: var(--text-dim); }
.tf-chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.tf-chip.active i { opacity: 0.8; }
.tf-count { font-size: 12px; color: var(--text-dim); margin-left: auto; }
.palette-tag { cursor: pointer; }
.palette-tag:hover { color: var(--text); border-color: var(--text-dim); }

/* Responsive */
@media (max-width: 700px) {
  .palette-grid, .palette-grid.cols-2, .palette-grid.cols-4 { grid-template-columns: 1fr; }
  .container { padding: 20px 12px; }
  .mock-wrap { flex-direction: column; }
}
</style>
</head>

  <header>
    <h1>配色使用表</h1>
    <p>常用配色方案速查 — 按情绪风格分类，按用途场景细分 · 每套含深/浅双版主页示意</p>
    <div class="classification-info">

  <div class="tabs-row">

      <button data-cols="2">2</button>

  <div id="content"></div>

</div>

/* ============ 颜色工具函数 ============ */
function rgb(hex) {
  return {
    r: parseInt(hex.slice(1,3), 16),
    g: parseInt(hex.slice(3,5), 16),
    b: parseInt(hex.slice(5,7), 16)
  };
}
function lum(hex) {
  const {r,g,b} = rgb(hex);
  return (r*299 + g*587 + b*114) / 1000;
}
function sat(hex) {
  const {r,g,b} = rgb(hex);
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
  return mx === 0 ? 0 : (mx - mn) / mx;
}
function mix(a, b, amt) { // amt: 0→a, 1→b
  const A = rgb(a), B = rgb(b);
  const to = v => Math.round(v).toString(16).padStart(2,'0').toUpperCase();
  return '#' + to(A.r+(B.r-A.r)*amt) + to(A.g+(B.g-A.g)*amt) + to(A.b+(B.b-A.b)*amt);
}
function isLight(hex) { return lum(hex) > 165; }

// 确保够亮（不够亮就往白混）
function ensureLight(hex) { const l = lum(hex); return l < 225 ? mix(hex, '#FFFFFF', Math.min(0.85, (225-l)/255*1.3)) : hex; }
// 确保够暗（不够暗就往黑混）
function ensureDark(hex) { const l = lum(hex); return l > 45 ? mix(hex, '#000000', Math.min(0.9, (l-45)/255*1.6)) : hex; }

/* 从一套配色派生浅色 / 深色两版主题 */
function deriveTheme(colors) {
  const infos = colors.map(c => ({ c, l: lum(c), s: sat(c) }));
  const byL = [...infos].sort((a,b) => a.l - b.l);
  const lightest = byL[0].c, darkest = byL[byL.length-1].c;

  // 选强调色：饱和度最高且明度适中的颜色
  const byS = [...infos].sort((a,b) => b.s - a.s);
  let acc = byS.find(x => x.l > 50 && x.l < 225);
  if (!acc) acc = byS[0];
  let accent = acc.c;
  if (acc.s < 0.12) accent = '#58A6FF'; // 纯黑白灰类配色给默认强调色
  let acc2 = byS.find(x => x.c !== accent && x.s > 0.15);
  let accent2 = acc2 ? acc2.c : mix(accent, '#FFFFFF', 0.25);

  // 浅色版
  const lBg = ensureLight(lightest);
  const lText = ensureDark(darkest);
  const lightTheme = {
    bg: lBg,
    surface: mix(lBg, lText, 0.06),
    text: lText,
    muted: mix(lText, lBg, 0.45),
    accent: accent,
    accent2: accent2
  };

  // 深色版（强调色太暗时提亮）
  const dBg = ensureDark(darkest);
  const dText = ensureLight(lightest);
  let dAccent = accent, dAccent2 = accent2;
  if (lum(dAccent) < 75) dAccent = mix(dAccent, '#FFFFFF', 0.3);
  if (lum(dAccent2) < 75) dAccent2 = mix(dAccent2, '#FFFFFF', 0.3);
  const darkTheme = {
    bg: dBg,
    surface: mix(dBg, '#FFFFFF', 0.09),
    text: dText,
    muted: mix(dText, dBg, 0.45),
    accent: dAccent,
    accent2: dAccent2
  };

  return { light: lightTheme, dark: darkTheme };
}

function mapTags(tags) {
  const seen = new Set(), out = [];
  tags.forEach(t => { const m = TAG_MAP[t] || t; if (!seen.has(m)) { seen.add(m); out.push(m); } });
  return out;
}

moods.forEach((mood, i) => {
  const tab = document.createElement('div');
  tab.className = 'tab' + (i === 0 ? ' active' : '');
  tab.dataset.idx = i;
  tab.innerHTML = `<span class="dot" style="background:${mood.color}"></span>${i+1}. ${mood.name}`;
  tab.onclick = () => switchTab(i);
  tabsEl.appendChild(tab);
});

/* ============ 列数切换（1 / 2 / 4 列） ============ */
const colSwitch = document.getElementById('colSwitch');
let currentCols = localStorage.getItem('palette-cols') || 'auto';
applyCols(currentCols);
colSwitch.querySelectorAll('button').forEach(btn => {
  btn.onclick = () => {
    currentCols = btn.dataset.cols;
    localStorage.setItem('palette-cols', currentCols);
    applyCols(currentCols);
  };
});
function applyCols(cols) {
  colSwitch.querySelectorAll('button').forEach(b =>
    b.classList.toggle('active', b.dataset.cols === cols));
  const cls = cols === 'auto' ? '' : ` cols-${cols}`;
  document.querySelectorAll('.palette-grid').forEach(g => {
    g.className = 'palette-grid' + cls;
  });
}

moods.forEach((mood, i) => {
  const section = document.createElement('div');
  section.className = 'tab-content' + (i === 0 ? ' active' : '');
  section.dataset.idx = i;

  let html = `
    <div class="mood-header">
      <div class="mood-number">${mood.id}</div>
      <div class="mood-info">
        <h2>${mood.name}</h2>
        <p>${mood.desc}</p>
      </div>
    </div>
  `;

  Object.entries(mood.usecases).forEach(([usecase, palettes]) => {
    html += `<div class="usecase-section">`;
    html += `<div class="usecase-title"><span class="icon">${usecaseIcons[usecase]||'·'}</span>${usecase}</div>`;
    html += `<div class="palette-grid">`;

    palettes.forEach(p => {
      const proportions = [30, 25, 20, 15, 10].slice(0, p.colors.length);
      const sum = proportions.reduce((a,b)=>a+b, 0);
      const adjusted = proportions.map(x => Math.round(x * 100 / sum));
      const broadTags = mapTags(p.tags);

      html += `<div class="palette-card" data-tags="${broadTags.join('|')}">`;
      html += `<div class="palette-header">
        <span class="palette-name">${p.name}</span>
        <div class="palette-tags">${broadTags.map(t=>`<span class="palette-tag">${t}</span>`).join('')}</div>
      </div>`;
      html += `<div class="swatches">`;
      p.colors.forEach(c => {
        const textColor = isLight(c) ? '#000' : '#fff';
        html += `<div class="swatch" style="background:${c}" data-hex="${c}">
          <span class="swatch-hex" style="background:${c};color:${textColor}">${c}</span>
        </div>`;
      });
      html += `</div>`;
      html += `<div class="palette-body">
        <div class="palette-desc">${p.desc}</div>
        <div class="palette-hex-list">`;
      p.colors.forEach(c => {
        html += `<span class="hex-chip" data-hex="${c}"><span class="dot" style="background:${c}"></span>${c}</span>`;
      });
      html += `</div>
        <div class="proportion-bar">`;
      adjusted.forEach((pct, idx) => {
        html += `<div style="flex:${pct};background:${p.colors[idx]}"></div>`;
      });
      html += `</div>
      </div>`;

      // 主页示意（浅色 + 深色并排）
      const theme = deriveTheme(p.colors);
      html += `<div class="mock-area">
        <div class="mock-area-title">主页示意 · HOMEPAGE PREVIEW</div>
        <div class="mock-wrap">
          ${mockHTML(theme.light, '浅色调')}
          ${mockHTML(theme.dark, '深色调')}
        </div>
      </div>`;

      html += `</div>`;
    });

    html += `</div></div>`;
  });

  section.innerHTML = html;
  contentEl.appendChild(section);
});

let currentTab = 0;
function switchTab(idx) {
  currentTab = idx;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', parseInt(t.dataset.idx) === idx));
  if (activeTag) { setTag(null); window.scrollTo({ top: document.querySelector('.tabs').offsetTop - 20, behavior: 'smooth' }); return; }
  applyFilter();
  window.scrollTo({ top: document.querySelector('.tabs').offsetTop - 20, behavior: 'smooth' });
}

/* ============ 标签筛选 ============ */
const tagFilterEl = document.getElementById('tagFilter');
const tagCounts = {};
moods.forEach(m => Object.values(m.usecases).forEach(arr =>
  arr.forEach(p => mapTags(p.tags).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }))));
const sortedTags = Object.keys(tagCounts).sort((a, b) => tagCounts[b] - tagCounts[a]);

let activeTag = null;
function renderTagFilter() {
  let h = `<span class="tf-label">筛选</span><button class="tf-chip${activeTag ? '' : ' active'}" data-tag="">全部</button>`;
  sortedTags.forEach(t => {
    h += `<button class="tf-chip${activeTag === t ? ' active' : ''}" data-tag="${t}">${t}<i>${tagCounts[t]}</i></button>`;
  });
  h += `<span class="tf-count" id="tfCount"></span>`;
  tagFilterEl.innerHTML = h;
}
function setTag(tag) {
  activeTag = tag;
  renderTagFilter();
  applyFilter();
}
function applyFilter() {
  let total = 0;
  document.querySelectorAll('.tab-content').forEach(sec => {
    if (!activeTag) {
      sec.querySelectorAll('.palette-card, .usecase-section').forEach(el => el.style.display = '');
      sec.classList.toggle('active', parseInt(sec.dataset.idx) === currentTab);
      return;
    }
    let secVisible = false;
    sec.querySelectorAll('.usecase-section').forEach(us => {
      let vis = 0;
      us.querySelectorAll('.palette-card').forEach(card => {
        const match = (card.dataset.tags || '').split('|').includes(activeTag);
        card.style.display = match ? '' : 'none';
        if (match) vis++;
      });
      us.style.display = vis ? '' : 'none';
      if (vis) secVisible = true;
      total += vis;
    });
    sec.classList.toggle('active', secVisible);
  });
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', !activeTag && parseInt(t.dataset.idx) === currentTab));
  const cnt = document.getElementById('tfCount');
  if (cnt) cnt.textContent = activeTag ? `「${activeTag}」共 ${total} 套配色` : '';
}
tagFilterEl.addEventListener('click', e => {
  const chip = e.target.closest('.tf-chip');
  if (!chip) return;
  setTag(chip.dataset.tag || null);
  window.scrollTo({ top: tagFilterEl.offsetTop - 20, behavior: 'smooth' });
});
renderTagFilter();

/* Copy hex */
const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
}

document.addEventListener('click', (e) => {
  const ptag = e.target.closest('.palette-tag');
  if (ptag) {
    setTag(ptag.textContent.trim());
    window.scrollTo({ top: tagFilterEl.offsetTop - 20, behavior: 'smooth' });
    return;
  }
  const hex = e.target.closest('[data-hex]')?.dataset.hex;
  if (hex) {
    navigator.clipboard.writeText(hex).then(() => showToast(`已复制 ${hex}`)).catch(() => {});
  }
});
